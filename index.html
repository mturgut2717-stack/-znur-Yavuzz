<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öznur Yavuz - Mutlu Yıllar 🎉</title>
    <style>
        body {
            margin: 0;
            padding: 20px 15px;
            font-family: system-ui, sans-serif;
            background: #000000;
            color: white;
            text-align: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 3rem;
            margin: 15px 0 8px;
            text-shadow: 0 0 30px #ff4757, 0 0 60px #ff4757;
            animation: glow 2s infinite alternate;
        }
        .photo {
            width: 280px;
            height: 280px;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid #ff4757;
            margin: 20px auto;
            box-shadow: 0 0 40px rgba(255, 71, 87, 0.6);
            display: block;
        }
        button {
            margin: 18px 8px;
            padding: 16px 45px;
            font-size: 1.35rem;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(255,71,87,0.5);
        }
        .message {
            margin: 20px auto;
            padding: 22px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            max-width: 90%;
            line-height: 1.7;
            font-size: 1.15rem;
        }
        .balloon, .heart {
            position: fixed;
            z-index: 100;
            font-size: 48px;
            animation: floatUp linear forwards;
        }
        @keyframes glow { from {text-shadow:0 0 20px #ff4757;} to {text-shadow:0 0 50px #ff4757, 0 0 80px #ff9a9e;} }
        @keyframes floatUp { to { transform: translateY(-160vh) rotate(40deg); opacity: 0; } }
    </style>
</head>
<body>
    <h1>Öznur Yavuz</h1>
    <p style="font-size:1.8rem;">🎂 Mutlu Yıllar! 💖</p>
    
    <img src="https://i.imgur.com/RiQhY6Q.jpg" class="photo" alt="Öznur Yavuz">

    <div class="message">
        Bazen insanlar güzeldir.<br>
        Sadece görünüşleriyle değil.<br>
        Sadece söyledikleriyle değil.<br>
        Olduklarıyla.<br><br>
        Varlığın hayatıma anlam katıyor.<br>
        İyi ki doğdun, iyi ki varsın..
    </div>

    <button onclick="playMusic()">Müzik Aç 🎵</button>
    <button onclick="startParty()">Parti Başlasın 💖</button>

    <iframe id="musicPlayer" width="0" height="0" src="" frameborder="0" allow="autoplay"></iframe>

    <script>
        function playMusic() {
            document.getElementById('musicPlayer').src = "https://www.youtube.com/embed/rHbNUn2D3jc?start=38&autoplay=1";
        }

        function startParty() {
            playMusic();
            alert("🎉 Parti başladı!");

            for(let i=0; i<40; i++) {
                setTimeout(() => {
                    const b = document.createElement('div');
                    b.className = 'balloon';
                    b.textContent = '🎈';
                    b.style.left = Math.random()*100 + 'vw';
                    b.style.bottom = '-80px';
                    b.style.animationDuration = (Math.random()*9 + 11) + 's';
                    document.body.appendChild(b);
                    setTimeout(() => b.remove(), 28000);
                }, i*80);
            }

            for(let i=0; i<50; i++) {
                setTimeout(() => {
                    const h = document.createElement('div');
                    h.className = 'heart';
                    h.textContent = '💖';
                    h.style.left = Math.random()*100 + 'vw';
                    h.style.bottom = '-70px';
                    h.style.animationDuration = (Math.random()*8 + 10) + 's';
                    document.body.appendChild(h);
                    setTimeout(() => h.remove(), 26000);
                }, i*70);
            }
        }
    </script>
</body>
</html>
