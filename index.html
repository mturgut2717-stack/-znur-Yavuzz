<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Öznur Yavuz</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 12px 12px 20px;
  font-family: system-ui;
  background: #000;
  color: #fff;
  text-align: center;
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
}
h1 {
  font-size: 2.3rem;
  margin: 8px 0 4px;
  text-shadow: 0 0 18px #ff4757;
}
.photo {
  width: 200px;
  height: 200px;
  object-fit: cover;
  border-radius: 50%;
  border: 5px solid #ff4757;
  margin: 8px auto;
  display: block;
}
.message {
  margin: 10px auto;
  padding: 12px 14px;
  background: rgba(255,255,255,0.12);
  border-radius: 14px;
  max-width: 95%;
  line-height: 1.45;
  font-size: 0.98rem;
}
button {
  display: block;
  width: 80%;
  max-width: 260px;
  margin: 14px auto 10px;
  padding: 14px;
  font-size: 1.25rem;
  background: #ff4757;
  color: #fff;
  border: none;
  border-radius: 50px;
  flex-shrink: 0;
}
.balloon, .heart {
  position: fixed;
  z-index: 99;
  font-size: 40px;
  animation: float linear forwards;
}
.cake {
  position: fixed;
  font-size: 100px;
  z-index: 300;
  left: 50%;
  bottom: -160px;
  transform: translateX(-50%);
  pointer-events: none;
}
.cream {
  position: fixed;
  border-radius: 50%;
  z-index: 301;
  pointer-events: none;
}
@keyframes float {
  to { transform: translateY(-160vh) rotate(35deg); opacity: 0; }
}
@keyframes cakeUp {
  0%   { bottom: -160px; transform: translateX(-50%) scale(0.5) rotate(0deg); opacity: 1; }
  100% { bottom: 48%; transform: translateX(-50%) scale(1.4) rotate(18deg); opacity: 1; }
}
@keyframes cakeDrip {
  0%   { bottom: 48%; transform: translateX(-50%) scale(1.4) rotate(18deg); opacity: 1; }
  100% { bottom: 8%; transform: translateX(-50%) scale(0.5) rotate(5deg); opacity: 0; }
}
</style>
</head>
<body>

<h1>Öznur Yavuz</h1>
<p style="font-size:1.35rem; margin:0 0 6px;">🎂 Mutlu Yıllar! 💖</p>

<img src="https://i.ibb.co/hJqpFwDs/IMG-20260726-001544.jpg" class="photo" id="face" alt="Öznur">

<div class="message">
Bazen insanlar güzeldir.<br>
Sadece görünüşleriyle değil.<br>
Sadece söyledikleriyle değil.<br>
Olduklarıyla.<br><br>
Varlığın hayatıma anlam katıyor.<br>
İyi ki doğdun, iyi ki varsın..
</div>

<button onclick="startParty()">Parti Başlasın 💖</button>

<iframe id="m" width="0" height="0" src="" allow="autoplay"></iframe>

<script>
function startParty() {
  document.getElementById('m').src = "https://www.youtube.com/embed/LuJvZv2DqF8?autoplay=1&playsinline=1";
  explodeCake();

  let count = 0;
  const interval = setInterval(() => {
    for(let i=0; i<3; i++){
      let b = document.createElement('div');
      b.className = 'balloon';
      b.textContent = '🎈';
      b.style.left = Math.random()*100 + 'vw';
      b.style.bottom = '-50px';
      b.style.animationDuration = (9 + Math.random()*7) + 's';
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 22000);
    }
    for(let i=0; i<4; i++){
      let h = document.createElement('div');
      h.className = 'heart';
      h.textContent = '💖';
      h.style.left = Math.random()*100 + 'vw';
      h.style.bottom = '-50px';
      h.style.animationDuration = (8 + Math.random()*6) + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 20000);
    }
    count++;
    if(count > 40) clearInterval(interval);
  }, 450);
}

function explodeCake() {
  const cake = document.createElement('div');
  cake.className = 'cake';
  cake.textContent = '🎂';
  document.body.appendChild(cake);

  // Yukarı uç
  cake.style.animation = 'cakeUp 1.1s cubic-bezier(0.25, 0.9, 0.3, 1) forwards';

  setTimeout(() => {
    // Kremler
    const face = document.getElementById('face');
    const rect = face.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    const colors = ['#ffffff','#fff5ee','#ffe4e1','#ffb6c1','#ffc0cb','#fffaf0'];

    for(let i = 0; i < 48; i++) {
      const cream = document.createElement('div');
      cream.className = 'cream';
      const size = 14 + Math.random() * 20;
      cream.style.width = size + 'px';
      cream.style.height = size + 'px';
      cream.style.background = colors[Math.floor(Math.random()*colors.length)];
      cream.style.left = cx + 'px';
      cream.style.top = cy + 'px';
      document.body.appendChild(cream);

      const angle = Math.random() * Math.PI * 2;
      const dist = 55 + Math.random() * 110;
      const x = Math.cos(angle) * dist;
      const y = Math.sin(angle) * dist;

      cream.animate([
        { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
        { transform: `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(0.1)`, opacity: 0 }
      ], {
        duration: 900 + Math.random() * 400,
        easing: 'ease-out'
      });

      setTimeout(() => cream.remove(), 1400);
    }

    // Yavaş süzülme
    cake.style.animation = 'cakeDrip 3.2s ease-in forwards';

  }, 1150);

  setTimeout(() => {
    if(cake.parentNode) cake.remove();
  }, 4500);
}
</script>
</body>
</html>
