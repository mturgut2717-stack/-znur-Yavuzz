<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Öznur Yavuz</title>
<style>
body{margin:0;padding:15px;font-family:system-ui;background:#000;color:#fff;text-align:center;min-height:100vh;overflow:hidden}
h1{font-size:2.6rem;margin:10px 0 5px;text-shadow:0 0 20px #ff4757}
.photo{width:240px;height:240px;object-fit:cover;border-radius:50%;border:5px solid #ff4757;margin:12px auto;display:block;position:relative;z-index:5}
.message{margin:15px auto;padding:15px;background:rgba(255,255,255,0.12);border-radius:16px;max-width:95%;line-height:1.5;font-size:1.05rem}
button{display:block;width:85%;max-width:280px;margin:18px auto;padding:16px;font-size:1.3rem;background:#ff4757;color:#fff;border:none;border-radius:50px}
.balloon,.heart{position:fixed;z-index:99;font-size:42px;animation:float linear forwards}
.cake{
  position:fixed;
  font-size:110px;
  z-index:300;
  left:50%;
  bottom:-150px;
  transform:translateX(-50%);
  pointer-events:none;
  transition:none;
}
.cake.fly{
  animation: cakeFly 1s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
}
.cream{
  position:fixed;
  border-radius:50%;
  z-index:301;
  pointer-events:none;
  box-shadow:0 0 8px rgba(255,255,255,0.6);
}
@keyframes float{to{transform:translateY(-160vh) rotate(35deg);opacity:0}}
@keyframes cakeFly{
  0%{bottom:-150px; transform:translateX(-50%) scale(0.5) rotate(0deg); opacity:1}
  70%{bottom:45%; transform:translateX(-50%) scale(1.5) rotate(18deg); opacity:1}
  100%{bottom:48%; transform:translateX(-50%) scale(0.1) rotate(50deg); opacity:0}
}
</style>
</head>
<body>

<h1>Öznur Yavuz</h1>
<p style="font-size:1.5rem;margin:0 0 10px;">🎂 Mutlu Yıllar! 💖</p>

<img src="https://i.ibb.co/hJqpFwDs/IMG-20260726-001544.jpg" class="photo" id="face" alt="Öznur">

<div class="message">
Bazen insanlar güzeldir.<br>
Sadece görünüşleriyle değil.<br>
Sadece söyledikleriyle değil.<br>
Olduklarıyla.<br><br>
Varlığın hayatıma anlam katıyor.<br>
İyi ki doğdun, iyi ki varsın..
</div>

<button onclick="startParty()">Parti Başlasın 💖</button>

<iframe id="m" width="0" height="0" src="" allow="autoplay"></iframe>

<script>
function startParty() {
  document.getElementById('m').src = "https://www.youtube.com/embed/LuJvZv2DqF8?autoplay=1&playsinline=1";
  explodeCake();

  // Balon + kalp
  let count = 0;
  const interval = setInterval(() => {
    for(let i=0; i<3; i++){
      let b = document.createElement('div');
      b.className = 'balloon';
      b.textContent = '🎈';
      b.style.left = Math.random()*100 + 'vw';
      b.style.bottom = '-50px';
      b.style.animationDuration = (9 + Math.random()*7) + 's';
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 22000);
    }
    for(let i=0; i<4; i++){
      let h = document.createElement('div');
      h.className = 'heart';
      h.textContent = '💖';
      h.style.left = Math.random()*100 + 'vw';
      h.style.bottom = '-50px';
      h.style.animationDuration = (8 + Math.random()*6) + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 20000);
    }
    count++;
    if(count > 40) clearInterval(interval);
  }, 450);
}

function explodeCake() {
  // Pasta oluştur
  const cake = document.createElement('div');
  cake.className = 'cake';
  cake.textContent = '🎂';
  document.body.appendChild(cake);

  // Uçuş animasyonunu başlat
  setTimeout(() => {
    cake.classList.add('fly');
  }, 50);

  // Krem patlaması
  setTimeout(() => {
    const face = document.getElementById('face');
    const rect = face.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    const colors = ['#ffffff','#fff5ee','#ffe4e1','#ffb6c1','#ffc0cb','#fffaf0','#ff69b4'];

    for(let i = 0; i < 55; i++) {
      const cream = document.createElement('div');
      cream.className = 'cream';
      const size = 12 + Math.random() * 24;
      cream.style.width = size + 'px';
      cream.style.height = size + 'px';
      cream.style.background = colors[Math.floor(Math.random()*colors.length)];
      cream.style.left = cx + 'px';
      cream.style.top = cy + 'px';
      document.body.appendChild(cream);

      const angle = Math.random() * Math.PI * 2;
      const dist = 50 + Math.random() * 130;
      const x = Math.cos(angle) * dist;
      const y = Math.sin(angle) * dist;

      cream.animate([
        { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
        { transform: `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(0.1)`, opacity: 0 }
      ], {
        duration: 650 + Math.random() * 450,
        easing: 'ease-out'
      });

      setTimeout(() => cream.remove(), 1200);
    }

    // Pastayı kaldır
    setTimeout(() => cake.remove(), 300);
  }, 750);
}
</script>
</body>
</html>
