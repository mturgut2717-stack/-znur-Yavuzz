<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öznur Yavuz - Mutlu Yıllar 🎉</title>
    <style>
        body {
            margin: 0;
            padding: 15px;
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #ff6b6b, #ff9a9e, #fad0c4);
            color: white;
            text-align: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 3rem;
            margin: 15px 0 8px;
            text-shadow: 0 0 30px white, 0 0 70px #ff4757;
            animation: glow 2s infinite alternate;
        }
        .photo {
            width: 100%;
            max-width: 320px;
            height: 340px;
            object-fit: cover;
            border-radius: 25px;
            border: 8px solid white;
            margin: 15px auto;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        button {
            margin: 20px 8px;
            padding: 17px 50px;
            font-size: 1.4rem;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 50px;
        }
        .balloon, .heart {
            position: fixed;
            z-index: 100;
            font-size: 50px;
            animation: floatUp linear forwards;
        }
        .confetti {
            position: fixed;
            width: 12px;
            height: 12px;
            z-index: 90;
            animation: confettiFall linear forwards;
        }
        @keyframes glow { from {text-shadow:0 0 20px #fff;} to {text-shadow:0 0 60px #fff, 0 0 90px #ff4757;} }
        @keyframes floatUp { to { transform: translateY(-150vh) rotate(35deg); opacity: 0; } }
        @keyframes confettiFall { to { transform: translateY(150vh) rotate(900deg); opacity: 0; } }
    </style>
</head>
<body>
    <h1>Öznur Yavuz</h1>
    <p style="font-size:1.85rem;">🎂 Mutlu Yıllar! 💖</p>
    
    <img src="https://i.postimg.cc/WNZdwfB9/1000119399.jpg" class="photo" alt="Öznur Yavuz">

    <div style="margin:20px auto;padding:22px;background:rgba(255,255,255,0.25);border-radius:25px;max-width:90%;">
        Sevgili Öznur,<br><br>
        Bu özel günde sana en içten dileklerimi gönderiyorum.<br><br>
        Sağlık, mutluluk ve en güzel anlarla dolu bir yıl olsun ✨
    </div>

    <button onclick="playMusic()">Müzik Aç 🎵</button>
    <button onclick="startParty()">Parti Başlasın 💖</button>

    <iframe id="musicPlayer" width="0" height="0" src="" frameborder="0" allow="autoplay"></iframe>

    <script>
        function playMusic() {
            document.getElementById('musicPlayer').src = "https://www.youtube.com/embed/rHbNUn2D3jc?start=38&autoplay=1";
        }

        function startParty() {
            playMusic();

            alert("🎉 Parti başladı! Müzik açılıyor...");

            // Daha az ama kaliteli ve uzun süren animasyonlar
            let count = 0;
            const interval = setInterval(() => {
                // Balonlar
                for (let i = 0; i < 4; i++) {
                    const b = document.createElement('div');
                    b.className = 'balloon';
                    b.textContent = '🎈';
                    b.style.left = Math.random() * 100 + 'vw';
                    b.style.bottom = '-80px';
                    b.style.animationDuration = (Math.random() * 10 + 12) + 's';
                    document.body.appendChild(b);
                    setTimeout(() => b.remove(), 32000);
                }

                // Kalpler
                for (let i = 0; i < 5; i++) {
                    const h = document.createElement('div');
                    h.className = 'heart';
                    h.textContent = '💖';
                    h.style.left = Math.random() * 100 + 'vw';
                    h.style.bottom = '-70px';
                    h.style.animationDuration = (Math.random() * 9 + 11) + 's';
                    document.body.appendChild(h);
                    setTimeout(() => h.remove(), 30000);
                }

                count++;
                if (count > 30) clearInterval(interval);
            }, 350);

            // İlk konfeti
            for (let i = 0; i < 180; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.top = '-10px';
                c.style.backgroundColor = `hsl(${Math.random()*360}, 100%, 65%)`;
                c.style.animationDuration = (Math.random() * 5 + 4) + 's';
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 14000);
            }
        }
    </script>
</body>
</html>
