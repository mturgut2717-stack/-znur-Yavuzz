<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Öznur Yavuz</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family: system-ui;
  text-align: center;
}
.container {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 10px 12px 16px;
}
h1 {
  font-size: 2.1rem;
  text-shadow: 0 0 16px #ff4757;
  margin-top: 4px;
}
.photo {
  width: 170px;
  height: 170px;
  object-fit: cover;
  border-radius: 50%;
  border: 4px solid #ff4757;
  margin: 6px auto;
  display: block;
}
.message {
  margin: 6px auto;
  padding: 10px 12px;
  background: rgba(255,255,255,0.12);
  border-radius: 12px;
  max-width: 95%;
  line-height: 1.4;
  font-size: 0.92rem;
}
button {
  width: 80%;
  max-width: 240px;
  margin: 8px auto 0;
  padding: 13px;
  font-size: 1.2rem;
  background: #ff4757;
  color: #fff;
  border: none;
  border-radius: 50px;
}
.balloon, .heart {
  position: fixed;
  z-index: 99;
  font-size: 38px;
  animation: float linear forwards;
}
.cake {
  position: fixed;
  font-size: 90px;
  z-index: 300;
  left: 50%;
  bottom: -140px;
  transform: translateX(-50%);
  pointer-events: none;
}
.cream {
  position: fixed;
  border-radius: 50%;
  z-index: 301;
  pointer-events: none;
}
@keyframes float {
  to { transform: translateY(-160vh) rotate(35deg); opacity: 0; }
}
@keyframes cakeUp {
  0%   { bottom: -140px; transform: translateX(-50%) scale(0.5) rotate(0deg); opacity: 1; }
  100% { bottom: 52%; transform: translateX(-50%) scale(1.35) rotate(18deg); opacity: 1; }
}
@keyframes cakeDrip {
  0%   { bottom: 52%; transform: translateX(-50%) scale(1.35) rotate(18deg); opacity: 1; }
  100% { bottom: 10%; transform: translateX(-50%) scale(0.5) rotate(5deg); opacity: 0; }
}
</style>
</head>
<body>
<div class="container">
  <div>
    <h1>Öznur Yavuz</h1>
    <p style="font-size:1.25rem; margin:2px 0 4px;">🎂 Mutlu Yıllar! 💖</p>
    <img src="https://i.ibb.co/hJqpFwDs/IMG-20260726-001544.jpg" class="photo" id="face" alt="Öznur">
    <div class="message">
      Bazen insanlar güzeldir.<br>
      Sadece görünüşleriyle değil.<br>
      Sadece söyledikleriyle değil.<br>
      Olduklarıyla.<br><br>
      Varlığın hayatıma anlam katıyor.<br>
      İyi ki doğdun, iyi ki varsın..
    </div>
  </div>

  <button onclick="startParty()">Parti Başlasın 💖</button>
</div>

<iframe id="m" width="0" height="0" src="" allow="autoplay"></iframe>

<script>
function startParty() {
  document.getElementById('m').src = "https://www.youtube.com/embed/LuJvZv2DqF8?autoplay=1&playsinline=1";
  explodeCake();

  let count = 0;
  const interval = setInterval(() => {
    for(let i=0; i<3; i++){
      let b = document.createElement('div');
      b.className = 'balloon';
      b.textContent = '🎈';
      b.style.left = Math.random()*100 + 'vw';
      b.style.bottom = '-50px';
      b.style.animationDuration = (9 + Math.random()*7) + 's';
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 22000);
    }
    for(let i=0; i<4; i++){
      let h = document.createElement('div');
      h.className = 'heart';
      h.textContent = '💖';
      h.style.left = Math.random()*100 + 'vw';
      h.style.bottom = '-50px';
      h.style.animationDuration = (8 + Math.random()*6) + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 20000);
    }
    count++;
    if(count > 40) clearInterval(interval);
  }, 450);
}

function explodeCake() {
  const cake = document.createElement('div');
  cake.className = 'cake';
  cake.textContent = '🎂';
  document.body.appendChild(cake);

  cake.style.animation = 'cakeUp 1.1s cubic-bezier(0.25, 0.9, 0.3, 1) forwards';

  setTimeout(() => {
    const face = document.getElementById('face');
    const rect = face.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    const colors = ['#ffffff','#fff5ee','#ffe4e1','#ffb6c1','#ffc0cb','#fffaf0'];

    for(let i = 0; i < 45; i++) {
      const cream = document.createElement('div');
      cream.className = 'cream';
      const size = 13 + Math.random() * 18;
      cream.style.width = size + 'px';
      cream.style.height = size + 'px';
      cream.style.background = colors[Math.floor(Math.random()*colors.length)];
      cream.style.left = cx + 'px';
      cream.style.top = cy + 'px';
      document.body.appendChild(cream);

      const angle = Math.random() * Math.PI * 2;
      const dist = 50 + Math.random() * 100;
      const x = Math.cos(angle) * dist;
      const y = Math.sin(angle) * dist;

      cream.animate([
        { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
        { transform: `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(0.1)`, opacity: 0 }
      ], {
        duration: 850 + Math.random() * 400,
        easing: 'ease-out'
      });

      setTimeout(() => cream.remove(), 1400);
    }

    cake.style.animation = 'cakeDrip 3.2s ease-in forwards';
  }, 1150);

  setTimeout(() => {
    if(cake.parentNode) cake.remove();
  }, 4500);
}
</script>
</body>
</html>
